name: Connector Actions Probe

on:
  push:
    branches:
      - agent/connector-actions-probe-20260802
  pull_request:
    branches:
      - master-refactor-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm connector-created PRs run workflows
        run: |
          set -euo pipefail
          printf 'connector-actions-probe=%s\n' "$GITHUB_SHA"
          printf 'ready-pr-synchronize=true\n'
