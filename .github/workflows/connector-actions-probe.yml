name: Connector Actions Probe

on:
  push:
    branches:
      - agent/connector-actions-probe-20260802

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm connector-created pushes run workflows
        run: |
          set -euo pipefail
          printf 'connector-actions-probe=%s\n' "$GITHUB_SHA"
