name: Agent export checkout bundle

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/checkout-export-base-20260729

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/checkout-export-trigger-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize merge inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/master-refactor-v2:refs/remotes/origin/master-refactor-v2'
          git update-ref refs/heads/bundle-main refs/remotes/origin/main
          git update-ref refs/heads/bundle-master-refactor-v2 refs/remotes/origin/master-refactor-v2
          git bundle create cooldex.bundle \
            refs/heads/bundle-main \
            refs/heads/bundle-master-refactor-v2
          {
            printf 'main=%s\n' "$(git rev-parse refs/heads/bundle-main)"
            printf 'master-refactor-v2=%s\n' "$(git rev-parse refs/heads/bundle-master-refactor-v2)"
            printf 'merge-base=%s\n' "$(git merge-base refs/heads/bundle-main refs/heads/bundle-master-refactor-v2)"
            sha256sum cooldex.bundle
          } > merge-inputs.txt
          git bundle verify cooldex.bundle

      - name: Upload checkout bundle
        uses: actions/upload-artifact@v4
        with:
          name: cooldex-checkout-bundle-20260729
          path: |
            cooldex.bundle
            merge-inputs.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
