# Merge-safety anchor: full-mode WSL runtime and test preparation are explicit
# for Linux/Unix package owners; voice source remains explicitly classified
# even though the defaults policy excludes its validation.
[[path_rules]]
patterns = [
  "codex-rs/uds/**",
  "codex-rs/utils/path-utils/**",
  "codex-rs/utils/pty/**",
  "codex-rs/voice-host/**",
  "codex-rs/worktree/**",
]
surfaces = ["cli"]
flags = ["runtime"]
wsl_runtime_packages = [
  "codex-uds",
  "codex-utils-path",
  "codex-utils-pty",
  "codex-worktree",
]

[[path_rules]]
patterns = ["codex-rs/hooks/**"]
packages = ["codex-hooks"]
surfaces = ["hooks_schema"]
flags = ["runtime"]
generators = ["write-hooks-schema"]

[[path_rules]]
patterns = ["codex-rs/.config/nextest.toml"]
surfaces = ["nextest_config"]
commands = ["nextest-config-check"]

[[path_rules]]
patterns = ["codex-rs/**/tests/**", "codex-rs/**/benches/**", "codex-rs/**/snapshots/**", "codex-rs/**/fixtures/**"]
flags = ["test_scope", "runtime"]

[[path_rules]]
patterns = ["codex-rs/Cargo.toml"]
surfaces = ["cli"]
flags = ["manifest_changed", "test_scope"]
prep_commands = ["bazel-lock-update"]
commands = ["bazel-lock-check"]

[[path_rules]]
patterns = ["codex-rs/**/Cargo.toml"]
flags = ["manifest_changed", "test_scope"]
prep_commands = ["bazel-lock-update"]
commands = ["bazel-lock-check"]

[[path_rules]]
patterns = ["codex-rs/Cargo.lock", "MODULE.bazel.lock"]
commands = ["bazel-lock-check"]

[[path_rules]]
patterns = ["BUILD.bazel", "codex-rs/**/BUILD.bazel", "MODULE.bazel"]
flags = ["bazel"]
commands = ["bazel-lock-check"]

[[path_rules]]
patterns = ["scripts/cargo-guard.sh"]
surfaces = ["validation_tooling"]
commands = ["guard-syntax", "guard-tests"]

[[path_rules]]
patterns = ["scripts/test-cargo-guard.sh"]
surfaces = ["validation_tooling"]
commands = ["guard-test-syntax", "guard-tests"]

[[path_rules]]
patterns = ["justfile"]
commands = ["just-summary", "validate-plan-self"]

[[path_rules]]
patterns = ["scripts/clear-windows-build-cache.ps1", "scripts/test-clear-windows-build-cache.py"]
surfaces = ["validation_tooling"]
commands = ["clear-windows-build-cache-tests"]

[[path_rules]]
patterns = ["scripts/cargo-validate.py", "scripts/cargo-validation.toml", "scripts/test-cargo-validate.py", "scripts/cargo-validate-windows.ps1", "scripts/test-cargo-validate-windows.py"]
surfaces = ["validation_tooling"]
commands = ["validate-py-compile", "validate-tests", "validate-windows-tests", "clear-windows-build-cache-tests", "validate-plan-self"]
