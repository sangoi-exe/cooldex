# Merge-safety anchor: this declarative map is the source of truth for deterministic
# cargo-validate package, surface, generator, self-test, receipt, and resource-profile selection.
schema_version = 1

[defaults]
standard_mode = "standard"
unknown_rust_path_policy = "package-plus-cli-strict"
workspace_features_policy = "deny-routine-all-features"
history_sample_limit = 20

[receipts]
dir = ".sangoi/validation"

[resource_profiles.check]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 16
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 80
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 1280
cargo_jobs_mem_reserve_mib = 8192
cargo_jobs_low_disk_max = 4

[resource_profiles.check_tests]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 12
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 70
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 2048
cargo_jobs_mem_reserve_mib = 10240
cargo_jobs_low_disk_max = 4

[resource_profiles.test_no_run]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 10
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 65
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 3072
cargo_jobs_mem_reserve_mib = 12288
cargo_jobs_low_disk_max = 4

[resource_profiles.package_test]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
# Original runtime values were test_threads = 4 and low_disk_test_threads_max = 2.
# Keep runtime tests serialized until telemetry proves a safe higher thread cap.
test_threads = 1
low_disk_test_threads_max = 1
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 8
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 60
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 3072
cargo_jobs_mem_reserve_mib = 12288
cargo_jobs_low_disk_max = 4

[resource_profiles.clippy]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 10
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 65
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 2560
cargo_jobs_mem_reserve_mib = 10240
cargo_jobs_low_disk_max = 4

[resource_profiles.build]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 12
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 70
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 2048
cargo_jobs_mem_reserve_mib = 10240
cargo_jobs_low_disk_max = 4

[resource_profiles.workspace_nextest]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
# Original runtime values were test_threads = 4 and low_disk_test_threads_max = 2.
# Keep runtime tests serialized until telemetry proves a safe higher thread cap.
test_threads = 1
low_disk_test_threads_max = 1
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 4
cargo_jobs_max = 8
cargo_jobs_hard_max = 16
cargo_jobs_cpu_pct = 55
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 3584
cargo_jobs_mem_reserve_mib = 14336
cargo_jobs_low_disk_max = 4

[resource_profiles.workspace_nextest_tight]
reserve_free_pct = 0
reserve_free_gib = 5
abort_free_pct = 0
abort_free_gib = 5
monitor = true
# Original runtime values were test_threads = 2 and low_disk_test_threads_max = 2.
# Keep runtime tests serialized until telemetry proves a safe higher thread cap.
test_threads = 1
low_disk_test_threads_max = 1
cargo_jobs_mode = "auto"
cargo_jobs_default = "min"
cargo_jobs_min = 3
cargo_jobs_max = 6
cargo_jobs_hard_max = 12
cargo_jobs_cpu_pct = 50
cargo_jobs_cpu_reserve = 4
cargo_jobs_mem_per_job_mib = 4096
cargo_jobs_mem_reserve_mib = 16384
cargo_jobs_low_disk_max = 3

# Feature profiles are intentionally absent until a package needs one. Add entries
# in this shape instead of letting agents invent --features by hand:
#
# [[package_features]]
# package = "codex-example"
# profiles = { standard = [[]], strict = [[]] }

[[package_features]]
package = "codex-code-mode"
profiles = { standard = [[]], strict = [[]] }

[[package_features]]
package = "codex-tui"
profiles = { standard = [[]], strict = [[]] }

[[package_features]]
package = "codex-v8-poc"
profiles = { standard = [[]], strict = [[]] }

[commands.write-config-schema]
argv = ["just", "write-config-schema"]
profile = "build"

[commands.write-app-server-schema]
argv = ["just", "write-app-server-schema"]
profile = "build"

[commands.write-hooks-schema]
argv = ["just", "write-hooks-schema"]
profile = "build"

[commands.bazel-lock-update]
argv = ["just", "bazel-lock-update"]
profile = "build"

[commands.bazel-lock-check]
argv = ["just", "bazel-lock-check"]

[commands.guard-syntax]
argv = ["bash", "-n", "scripts/cargo-guard.sh"]

[commands.guard-test-syntax]
argv = ["bash", "-n", "scripts/test-cargo-guard.sh"]

[commands.just-summary]
argv = ["just", "--summary"]

[commands.nextest-config-check]
argv = ["python3", "-c", "from pathlib import Path; import tomllib; text = Path('codex-rs/.config/nextest.toml').read_text(); config = tomllib.loads(text); profiles = config.get('profile', {}); assert profiles['local-safe']['fail-fast'] is False; assert 'test-threads' not in profiles['local-safe']; assert profiles['local-disk-tight']['fail-fast'] is False; assert 'test-threads' not in profiles['local-disk-tight']; assert text.count('codex-windows-sandbox') == 1; assert text.count('windows_sandbox_legacy_sessions') == 2; print('nextest config checks ok')"]

[commands.validate-py-compile]
argv = ["python3", "-m", "py_compile", "scripts/cargo-validate.py"]

[commands.validate-tests]
argv = ["python3", "scripts/test-cargo-validate.py"]

[commands.guard-tests]
argv = ["just", "test-cargo-guard"]

[commands.first-party-runtime-support-bins]
argv = ["./scripts/cargo-guard.sh", "cargo", "build", "-p", "codex-cli", "--bin", "codex", "-p", "codex-rmcp-client", "--bin", "test_stdio_server", "--bin", "test_streamable_http_server", "-p", "codex-exec", "--bin", "codex-exec", "-p", "codex-linux-sandbox", "--bin", "codex-linux-sandbox", "-p", "codex-shell-escalation", "--bin", "codex-execve-wrapper"]
profile = "build"

[commands.validate-plan-self]
argv = ["./scripts/cargo-guard.sh", "plan", "--file", "scripts/cargo-validate.py", "--mode", "standard", "--no-receipt"]

[[surfaces]]
name = "cli"
target_args = ["-p", "codex-cli", "--bin", "codex"]
strict_recipes = ["strict-codex-bin"]
smoke_recipes = ["smoke-codex-bin"]

[[surfaces]]
name = "tui"
target_args = ["-p", "codex-tui"]

[[surfaces]]
name = "exec"
target_args = ["-p", "codex-exec"]

[[surfaces]]
name = "app_server"
target_args = ["-p", "codex-app-server"]

[[surfaces]]
name = "app_server_protocol"
target_args = ["-p", "codex-app-server-protocol"]

[[surfaces]]
name = "config_schema"
target_args = ["-p", "codex-config"]

[[surfaces]]
name = "hooks_schema"
target_args = ["-p", "codex-hooks"]

[[surfaces]]
name = "sandbox_linux"
target_args = ["-p", "codex-sandboxing"]

[[surfaces]]
name = "auth"
target_args = ["-p", "codex-login"]

[[surfaces]]
name = "validation_tooling"

[[surfaces]]
name = "nextest_config"

[[path_rules]]
patterns = ["codex-rs/cli/**"]
packages = ["codex-cli"]
surfaces = ["cli"]
flags = ["runtime"]

[[path_rules]]
patterns = ["codex-rs/core/src/config/**"]
packages = ["codex-core"]
surfaces = ["cli", "config_schema"]
flags = ["runtime"]
generators = ["write-config-schema"]

[[path_rules]]
patterns = ["codex-rs/core/**"]
packages = ["codex-core"]
surfaces = ["cli"]
