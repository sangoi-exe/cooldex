# Merge-safety anchor: this declarative map is the source of truth for deterministic
# cargo-validate package, surface, platform-accounted manifest, native-Windows
# bootstrap, generator, self-test, receipt, and resource-profile selection.
schema_version = 1

[defaults]
standard_mode = "standard"
unknown_rust_path_policy = "package-plus-cli-strict"
workspace_features_policy = "deny-routine-all-features"
history_sample_limit = 20
# Merge-safety anchor: voice source stays in the workspace, while this
# operator-path selection policy excludes only its validation and preserves an
# explicit unvalidated disclosure in planner output.
validation_excluded_packages = ["codex-voice-host"]

[receipts]
dir = ".sangoi/validation"

# Native Windows uses installed C-drive tools only as read-only inputs. Every
# run-created path is rooted below this literal F-drive cache namespace.
# Version, URL, and digest pins are declarative here; the planner validates
# coherent artifact paths from these values without mirroring the pins.
[windows_runtime]
cache_root = 'F:\.cache'
workflow_namespace = "cw"
minimum_free_disk_gib = 120
minimum_available_memory_gib = 30
target = "x86_64-pc-windows-msvc"
rust_toolchain = "1.95.0-x86_64-pc-windows-msvc"
nextest_version = "0.9.103"
nextest_url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.103/cargo-nextest-0.9.103-x86_64-pc-windows-msvc.zip"
nextest_sha256 = "f4764e4f58c297b917364922b998c70b521a2fda271b0a7d141654a9800817d6"
v8_version = "150.4.0"
v8_archive_url = "https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0/rusty_v8_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.lib.gz"
v8_archive_sha256 = "732ec5da4243aa166799780c8519a5eea6f32f6e47657a323342794dc3c239d6"
v8_binding_url = "https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0/src_binding_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.rs"
v8_binding_sha256 = "dabf78ba1faac127660db9862b1d0354175c71b8db2d4fcb5bacbd9c93576b16"

