[package]
name = "codex-utils-cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lru = { workspace = true }
sha1 = { workspace = true }
# Merge-safety anchor: Tokio `rt` is needed only for storage gating; locking and initialization stay synchronous in the standard library without scheduler handoff.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lib]
doctest = false
