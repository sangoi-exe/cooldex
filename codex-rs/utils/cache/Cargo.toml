[package]
name = "codex-utils-cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lru = { workspace = true }
sha1 = { workspace = true }
# Merge-safety anchor: runtime gating and blocking initialization need Tokio `rt` and `rt-multi-thread`; locking remains standard-library only.
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lib]
doctest = false
