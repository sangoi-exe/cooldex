[package]
name = "codex-utils-cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lru = { workspace = true }
sha1 = { workspace = true }
# Merge-safety anchor: cache runtime gating needs Tokio `rt`; locking is standard-library only.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lib]
doctest = false
