message UnsupportedExecServerMessage {}

message ExecClientMessage {
  uint32 id = 1;
  string exec_id = 15;
  optional int32 local_execution_time_ms = 39;

  oneof message {
    RequestContextResult request_context_result = 10;
    McpResult mcp_result = 11;
  }
}

message InteractionUpdate {
  oneof message {
    TextDeltaUpdate text_delta = 1;
    UnsupportedInteractionUpdate tool_call_started = 2;
    UnsupportedInteractionUpdate tool_call_completed = 3;
    UnsupportedInteractionUpdate thinking_delta = 4;
    UnsupportedInteractionUpdate thinking_completed = 5;
    UnsupportedInteractionUpdate user_message_appended = 6;
    UnsupportedInteractionUpdate partial_tool_call = 7;
    UnsupportedInteractionUpdate token_delta = 8;
    UnsupportedInteractionUpdate summary = 9;
    UnsupportedInteractionUpdate summary_started = 10;
