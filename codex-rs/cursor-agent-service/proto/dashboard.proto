//
// This is the strict identity subset used before AgentService.Run. Cooldex
// sends an empty GetMeRequest and consumes only the authenticated user and team
// identifiers required by the configured corporate identity pin.
syntax = "proto3";

package aiserver.v1;

service DashboardService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message GetMeRequest {
  optional int32 team_id = 1;
  optional string source_site_hostname = 2;
  optional bool include_mobile_app_status = 3;
}

message GetMeResponse {
  string auth_id = 1;
  int32 user_id = 2;
  optional string email = 3;
  optional string first_name = 4;
  optional string last_name = 5;
  optional string workos_id = 6;
  optional int32 team_id = 7;
}
